<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Yash</title>

<style>
body{
  margin:0;
  font-family:Comic Sans MS, cursive;
  background:linear-gradient(135deg,#e6f7ff,#ccf2ff);
  overflow:hidden;
  text-align:center;
}

/* Banner */
#banner{
  margin-top:30px;
  font-size:48px;
  color:#0077b6;
  font-weight:bold;
  text-shadow:2px 2px white;
}

/* Cake */
#cake{
  width:280px;
  margin-top:30px;
}

/* Hearts */
.heart{
  position:absolute;
  bottom:-50px;
  width:35px;
  animation:floatHearts 8s linear infinite;
}

@keyframes floatHearts{
  to{transform:translateY(-120vh);}
}

/* Confetti */
.confetti{
  position:absolute;
  width:10px;
  height:10px;
  top:-10px;
  background:red;
  animation:fall 5s linear infinite;
}

@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg);}
}

p{
  font-size:26px;
  color:#333;
  margin-top:15px;
}
</style>
</head>

<body>

<div id="banner">🎉 Happy Birthday Yash! 🎉</div>

<!-- Cake Image -->
<img id="cake" src="./2.png" alt="Birthday Cake">

<p>We hope you have a wonderful day full of smiles 🎈💙</p>

<!-- Hearts -->
<img class="heart" style="left:20%;animation-delay:1s" src="https://cdn-icons-png.flaticon.com/512/833/833472.png">
<img class="heart" style="left:50%;animation-delay:2s" src="https://cdn-icons-png.flaticon.com/512/833/833472.png">
<img class="heart" style="left:75%;animation-delay:3s" src="https://cdn-icons-png.flaticon.com/512/833/833472.png">

<!-- Music -->
<audio autoplay loop>
  <source src="1.mp3">
</audio>

<script>
for(let i=0;i<70;i++){
  let c=document.createElement("div");
  c.className="confetti";
  c.style.left=Math.random()*100+"vw";
  c.style.background=`hsl(${Math.random()*360},100%,50%)`;
  c.style.animationDuration=(3+Math.random()*3)+"s";
  document.body.appendChild(c);
}
</script>

</body>
</html>
